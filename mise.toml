[dotfiles]
# --- Shell ---
"~/.zshrc" = "zsh/zshrc"
"~/.aliases" = "zsh/aliases"

# --- Version control ---
"~/.gitconfig" = "git/config"
"~/.config/git/ignore" = "git/ignore"

# --- Credentials ---
"~/.ssh/config" = "ssh/config"

# --- Ruby ---
"~/.irbrc" = "ruby/irbrc"
"~/.pryrc" = "ruby/pryrc"
"~/.rspec" = "ruby/rspec"

# --- CLI tools ---
"~/.config/herdr/config.toml" = "herdr/config.toml"

# --- AI agents ---
"~/.pi/agent/settings.json" = "pi/settings.json"
"~/.pi/agent/extensions" = "pi/extensions"

# oh-my-zsh ships neither plugin, and zsh/zshrc lists both in `plugins`.
[bootstrap.repos]
"~/.oh-my-zsh/custom/plugins/zsh-autosuggestions" = "https://github.com/zsh-users/zsh-autosuggestions"
"~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = "https://github.com/zsh-users/zsh-syntax-highlighting"
